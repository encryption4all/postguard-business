# Build, scan (Anchore) and publish the container image to
# ghcr.io/privacybydesign/postguard-business, signed with keyless cosign.
#   push to main                   -> :edge
#   manual run on a release tag    -> :<version>   (started by "Release please")
#   manual run on a branch         -> :<branch>
# Pull request builds are scanned in "Status checks" without being pushed, and
# the published images are re-scanned weekly by "Image rescan".
name: Delivery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  docker:
    uses: privacybydesign/github-workflows/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      dockerfile: docker/Dockerfile
      platforms: linux/amd64,linux/arm64
      cosign: true
